<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Cat Game</title>
</head>
<body>

<header>

<div class="scores">
<h1>SCORES</h1>

<div id="leaderboard"></div>

</div>

</header>

<main>

<input
type="file"
id="imageUpload">

<option>4x4</option>

</button>

</section>

<section class="game-area">

<div id="pieceContainer"></div>

</section>

</main>

</body>
</html>
